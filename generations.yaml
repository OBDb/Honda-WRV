generations:
  - name: "First Generation (GL)"
    start_year: 2017
    end_year: 2023
    description: "The first-generation Honda WR-V (GL) was a subcompact crossover SUV developed by Honda R&D Center of Brazil in collaboration with Japan. It was based on the third-generation Honda Fit/Jazz platform (Honda Global Small Car), featuring different front fascia and bonnet treatments. The model was specifically developed for emerging markets in South America (Brazil) and India, with ground clearance of 188mm. Available engines included a 1.2L i-VTEC petrol (89 HP) for India, 1.5L i-VTEC petrol (88 kW) for Brazil, and a 1.5L i-DTEC turbo diesel (99 HP) for India. The WR-V shared its body shell, doors, dashboard and instrument panel with the Fit/Jazz. It received a facelift in 2020 for both markets."

  - name: "Second Generation (DG4)"
    start_year: 2022
    end_year: null
    description: "The second-generation WR-V (DG4) was previewed by the SUV RS concept at the 2021 Indonesia International Auto Show and launched in Indonesia on November 2, 2022. Developed by Honda R&D Asia Pacific, it is based on the shortened second-generation BR-V's platform (also shared with the second-gen Honda Amaze), representing a significant shift from the Fit/Jazz-based first generation. Power comes from a 1.5L L15ZF DOHC i-VTEC engine producing 89 kW (121 PS). Ground clearance increased to 220mm. Initially available with CVT, a 6-speed manual was later added for the E trim in May 2023. It is assembled in Indonesia (Karawang) and Malaysia (Alor Gajah), with exports to Thailand, Brunei, Philippines and other markets. Honda Sensing is available on higher trims."